name: Publish Release

# Trigger on version tags like v1.0.0 or v1.2.3
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write  # needed to create releases and push manifest.json

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout (full history so we can push back to main) ──────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Derive version from the pushed tag ──────────────────────────────
      - name: Extract version
        id: version
        run: |
          # tag = v1.2.3  →  VERSION = 1.2.3  →  ASSEMBLY_VERSION = 1.2.3.0
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "TAG_VERSION=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ASSEMBLY_VERSION=${TAG}.0" >> "$GITHUB_OUTPUT"
          echo "ZIP_NAME=jellyfin-youtubesync_${TAG}_12.x.zip" >> "$GITHUB_OUTPUT"

      # ── 3. Patch the version in meta.json before building ──────────────────
      - name: Update meta.json version
        run: |
          VERSION="${{ steps.version.outputs.ASSEMBLY_VERSION }}"
          python3 - << 'PYEOF'
          import json, os, sys
          path = "Jellyfin.Plugin.YouTubeSync/meta.json"
          with open(path) as f:
              data = json.load(f)
          data["version"] = os.environ["VERSION"]
          with open(path, "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PYEOF
        env:
          VERSION: ${{ steps.version.outputs.ASSEMBLY_VERSION }}

      # ── 4. Setup .NET 10 SDK ───────────────────────────────────────────────
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ── 5. Build for Jellyfin 12.x ────────────────────────────────────────
      - name: Publish plugin
        run: |
          dotnet publish Jellyfin.Plugin.YouTubeSync/Jellyfin.Plugin.YouTubeSync.csproj \
            -f net10.0 \
            -c Release \
            --no-self-contained \
            -p:Version=${{ steps.version.outputs.ASSEMBLY_VERSION }} \
            -p:AssemblyVersion=${{ steps.version.outputs.ASSEMBLY_VERSION }} \
            -p:FileVersion=${{ steps.version.outputs.ASSEMBLY_VERSION }} \
            -p:InformationalVersion=${{ steps.version.outputs.TAG_VERSION }} \
            -o publish/

      # ── 6. Bundle the DLL with Jellyfin 12 ABI metadata ───────────────────
      - name: Create release ZIP
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          base_metadata = json.loads(Path("Jellyfin.Plugin.YouTubeSync/meta.json").read_text())
          version = os.environ["TAG_VERSION"]
          base_metadata["targetAbi"] = "12.0.0.0"
          base_metadata["framework"] = "net10.0"
          meta_path = Path("publish/meta.json")
          meta_path.write_text(json.dumps(base_metadata, indent=2) + "\n")
          archive = Path(f"jellyfin-youtubesync_{version}_12.x.zip")
          with ZipFile(archive, "w", ZIP_DEFLATED) as package:
              package.write("publish/Jellyfin.Plugin.YouTubeSync.dll", "Jellyfin.Plugin.YouTubeSync.dll")
              package.write(meta_path, "meta.json")
          PYEOF
        env:
          TAG_VERSION: ${{ steps.version.outputs.TAG_VERSION }}

      # ── 7. Compute MD5 checksum (required by Jellyfin manifest) ────────────
      - name: Compute MD5 checksum
        id: checksum
        run: |
          echo "MD5=$(md5sum "${{ steps.version.outputs.ZIP_NAME }}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      # ── 8. Create the GitHub Release and upload the ZIP ───────────────────
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: "YouTubeSync v${{ steps.version.outputs.TAG_VERSION }}"
          generate_release_notes: true
          files: ${{ steps.version.outputs.ZIP_NAME }}

      # ── 9. Update manifest.json on the default branch ─────────────────────
      - name: Update manifest.json
        run: |
          export TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          DEFAULT_BRANCH=$(git remote show origin | awk '/HEAD branch/ {print $NF}')
          git fetch origin "${DEFAULT_BRANCH}"
          export DEFAULT_BRANCH
          export VERSION="${{ steps.version.outputs.ASSEMBLY_VERSION }}"
          export CHECKSUM="${{ steps.checksum.outputs.MD5 }}"
          export DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.version.outputs.ZIP_NAME }}"

          python3 - << 'PYEOF'
          import json, os, subprocess

          default_branch = os.environ["DEFAULT_BRANCH"]

          # Read the current manifest so prior Jellyfin 12 releases are preserved.
          raw = subprocess.check_output(
              ["git", "show", f"origin/{default_branch}:manifest.json"],
              text=True
          )
          data = json.loads(raw)

          new_entry = {
              "version": os.environ["VERSION"],
              "changelog": f"Release {os.environ['VERSION']} (Jellyfin 12.x)",
              "targetAbi": "12.0.0.0",
              "sourceUrl": os.environ["DOWNLOAD_URL"],
              "checksum": os.environ["CHECKSUM"],
              "timestamp": os.environ["TIMESTAMP"],
          }

          compatible_versions = [
              entry for entry in data[0]["versions"]
              if entry.get("targetAbi") == "12.0.0.0"
          ]
          data[0]["versions"] = [new_entry] + compatible_versions

          # Write to a temp file so the branch switch in the next step doesn't clobber it
          with open("/tmp/updated-manifest.json", "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PYEOF

      # ── 10. Commit the updated manifest.json back to main ─────────────────
      - name: Commit manifest.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DEFAULT_BRANCH=$(git remote show origin | awk '/HEAD branch/ {print $NF}')
          git fetch origin "${DEFAULT_BRANCH}"
          git checkout "${DEFAULT_BRANCH}"

          # Use the manifest built in the previous step (not the tag's copy)
          cp /tmp/updated-manifest.json manifest.json

          git add manifest.json
          git diff --cached --quiet && echo "manifest.json unchanged – nothing to commit" && exit 0
          git commit -m "chore: update manifest.json for v${{ steps.version.outputs.TAG_VERSION }} [skip ci]"
          git push origin "${DEFAULT_BRANCH}"
